# Esto le dice a Spring que no genere el usuario por defecto
spring.security.user.name=disabled
spring.security.user.password=disabled

# AWS S3 — almacenamiento de logos de tiendas
kingstore.storage.provider=${KINGSTORE_STORAGE_PROVIDER:local}
storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:../upload-local}
storage.local.base-url=${STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:kingstore-assets-563688183512-us-east-1-an}
aws.s3.region=${AWS_REGION:us-east-1}

# Límite de tamaño para carga masiva
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=150MB
