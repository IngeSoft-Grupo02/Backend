
# Servidor
server.port=8080

# Base de datos
spring.datasource.url=jdbc:mysql://kingstoremysql.c8wtco2nxica.us-east-1.rds.amazonaws.com:3306/kingstore?useSSL=true&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=admin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ENC(1ZWVwsgdP3MMf6aAg4WRkeoKwW6hG0eB)}}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Jasypt - Encriptación de propiedades sensibles
# IMPORTANTE: La clave se obtiene de la variable de entorno JASYPT_ENCRYPTOR_PASSWORD
# Ver .env.example para más detalles
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD:}
jasypt.encryptor.algorithm=PBEWithMD5AndTripleDES
jasypt.encryptor.key-obtention-iterations=1000
jasypt.encryptor.pool-size=1
jasypt.encryptor.provider-name=SunJCE
jasypt.encryptor.string-output-type=base64

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logs
logging.level.pe.edu.pucp.kingstore=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.file.name=logs/kingstore.log

# Nombre de la aplicación
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.application.name=kingstore-backend

# Perfil activo por defecto (sobreescribir con SPRING_PROFILES_ACTIVE=prod en producción)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Recuperación de contraseña por Gmail SMTP
# Usar una contraseña de aplicación de Google, nunca la contraseña normal de Gmail.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

kingstore.password-reset.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
kingstore.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
kingstore.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://100.57.218.181,http://100.57.218.181:*,https://ec2-100-57-218-181.compute-1.amazonaws.com,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}

#---------NOTA---------
