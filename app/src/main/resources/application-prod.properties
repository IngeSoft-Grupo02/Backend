# Bucket S3 donde se almacenan logos de tiendas
# Storage S3 (perfil prod usa S3StorageService en lugar de local)
kingstore.storage.provider=s3
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:kingstore-assets-563688183512-us-east-1-an}
aws.s3.region=${AWS_REGION:us-east-1}

# Logs menos verbosos
spring.jpa.show-sql=false
logging.level.pe.edu.pucp.kingstore=INFO
