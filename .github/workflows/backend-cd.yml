name: Backend CD

on:
  push:
    branches:
      - main
      - Development
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend to EC2
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Development'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_NAME: kingstore-backend:${{ github.sha }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_ENCRYPTOR_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'http://100.57.218.181' }}
          KINGSTORE_STORAGE_PROVIDER: ${{ vars.KINGSTORE_STORAGE_PROVIDER || 's3' }}
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME || 'kingstore-assets-563688183512-us-east-1-an' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          test -n "$JASYPT_ENCRYPTOR_PASSWORD"
          test -n "$JWT_SECRET"
          test -n "$SPRING_DATASOURCE_PASSWORD"
          test -n "$MAIL_USERNAME"
          test -n "$MAIL_APP_PASSWORD"
          test -n "$FRONTEND_BASE_URL"
          test -n "$KINGSTORE_STORAGE_PROVIDER"
          test -n "$AWS_S3_BUCKET_NAME"
          test -n "$AWS_REGION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package image
        run: docker save "$IMAGE_NAME" | gzip -1 > backend-image.tar.gz

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Write secrets file
        env:
          JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_ENCRYPTOR_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'http://100.57.218.181' }}
          KINGSTORE_STORAGE_PROVIDER: ${{ vars.KINGSTORE_STORAGE_PROVIDER || 's3' }}
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME || 'kingstore-assets-563688183512-us-east-1-an' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          printf 'JASYPT_ENCRYPTOR_PASSWORD=%s\nJWT_SECRET=%s\nSPRING_DATASOURCE_PASSWORD=%s\nMAIL_USERNAME=%s\nMAIL_APP_PASSWORD=%s\nFRONTEND_BASE_URL=%s\nKINGSTORE_STORAGE_PROVIDER=%s\nAWS_S3_BUCKET_NAME=%s\nAWS_REGION=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n' \
            "$JASYPT_ENCRYPTOR_PASSWORD" "$JWT_SECRET" "$SPRING_DATASOURCE_PASSWORD" \
            "$MAIL_USERNAME" "$MAIL_APP_PASSWORD" "$FRONTEND_BASE_URL" \
            "$KINGSTORE_STORAGE_PROVIDER" "$AWS_S3_BUCKET_NAME" "$AWS_REGION" \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" \
            > backend-secrets.env

      - name: Transfer deployment files
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'mkdir -p ~/kingstore/backend'
          scp -i ~/.ssh/deploy_key \
            backend-image.tar.gz docker-compose.production.yml backend-secrets.env \
            "$EC2_USER@$EC2_HOST:~/kingstore/backend/"
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'chmod 600 ~/kingstore/backend/backend-secrets.env && \
             mv ~/kingstore/backend/backend-secrets.env ~/kingstore/backend/.env'

      - name: Deploy container
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "BACKEND_IMAGE='$IMAGE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/kingstore/backend
          export BACKEND_IMAGE
          docker load --input backend-image.tar.gz
          docker compose -f docker-compose.production.yml up -d --remove-orphans
          rm -f backend-image.tar.gz
          docker image prune -f
          docker compose -f docker-compose.production.yml ps
          REMOTE

      - name: Verify deployment
        run: |
          curl --silent --output /dev/null \
            --retry 18 --retry-connrefused --retry-delay 5 \
            --max-time 5 \
            -X POST -H "Content-Type: application/json" -d '{}' \
            "http://$EC2_HOST:8080/auth/login"

      - name: Remove temporary credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key backend-image.tar.gz backend-secrets.env
